# GitHub Pages: rebuild the public slot list from the owner's published busy-only ICS feed.
# ICS_URL is a repository secret (Settings → Secrets and variables → Actions). Runs on every
# push to main, every 15 minutes (GitHub may delay scheduled runs by a few minutes), and by hand.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Compute free slots and assemble the site
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: |
          mkdir -p public
          cp -r site/. public/
          python compute_slots.py public/slots.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
