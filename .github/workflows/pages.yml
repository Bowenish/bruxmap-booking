# Fallback host (GitHub Pages) — MANUAL ONLY. The live site runs on the owner's VPS
# (server.py); this workflow rebuilds a static copy from the published busy-only ICS feed when
# started by hand (Actions → pages → Run workflow). To use it as the real host again: add the
# ICS_URL repository secret, set Settings → Pages → Source = GitHub Actions, and restore
#   push: { branches: [main] }   and   schedule: [ { cron: "*/5 * * * *" } ]
# under `on:`.
name: pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Compute free slots and assemble the site
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: |
          mkdir -p public
          cp -r site/. public/
          python compute_slots.py public/slots.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
